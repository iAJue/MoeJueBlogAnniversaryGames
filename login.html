<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 阿珏酱Blog十周年庆解密游戏</title>
    <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
    <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: url('./images/bg-surface.png') center center/cover no-repeat fixed;
        }

        .skip-btn {
            margin-right: auto;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: none;
            background: none;
            cursor: pointer;
            color: #666;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #4285f4;
        }
    </style>
</head>

<body>
    <div id="login-page" class="login-page">
        <div class="login-container">
            <div class="input-group">
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button onclick="checkLogin()">登录</button>
            <div id="message" class="message"></div>
        </div>
    </div>

    <div id="captcha-container" class="captcha-container hidden">
        <div class="captcha-box">
            <div class="captcha-header">
                <div class="header-text">
                    <div class="header-title">选择所有包含</div>
                    <div class="header-desc">
                        <span class="desc-text"></span>
                        <span class="desc-suffix">的图片，点按后请点击"验证"。</span>
                    </div>
                </div>
                <div class="icon">
                    <img src="" alt="cover">
                </div>
            </div>
            <div class="captcha-content">
                <div class="captcha-images">
                    <div class="image-grid">
                    </div>
                </div>
                <div class="captcha-footer">
                    <button class="action-btn refresh-btn" onclick="refreshCaptcha()">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor"
                                d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                        </svg>
                    </button>
                    <button class="action-btn about-btn" onclick="showAbout()">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor"
                                d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 9h2V7h-2v2z" />
                        </svg>
                    </button>
                    <button class="action-btn skip-btn" onclick="skipCaptcha()">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
                        </svg>
                    </button>
                    <button class="verify-btn" onclick="verifyCaptcha()">验证</button>
                </div>
            </div>
            <div class="verify-result">
                <div class="icon">
                    <svg class="success-icon" viewBox="0 0 24 24" style="display: none;">
                        <path fill="currentColor"
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                    </svg>
                    <svg class="error-icon" viewBox="0 0 24 24" style="display: none;">
                        <path fill="currentColor"
                            d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z" />
                    </svg>
                </div>
                <div class="message"></div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fingerprintjs2/2.1.4/fingerprint2.min.js"></script>
    <script>
        const validUsername = "blog10years";
        let currentCaptchaData = null;
        let selectedImages = new Set();
        let currentCaptchaIndex = Math.floor(Math.random() * 3);
        let browserFingerprint = null;

        Fingerprint2.get(function (components) {
            const values = components.map(function (component) { return component.value });
            browserFingerprint = Fingerprint2.x64hash128(values.join(''), 31);
        });

        function checkLogin() {
            const password = document.getElementById('password').value;

            if (!password) {
                showMessage("请输入密码", false);
                return;
            }

            // 重置验证结果
            const resultEl = document.querySelector('.verify-result');
            const successIcon = resultEl.querySelector('.success-icon');
            const errorIcon = resultEl.querySelector('.error-icon');
            
            resultEl.classList.remove('show', 'success', 'error');
            successIcon.style.display = 'none';
            errorIcon.style.display = 'none';
            resultEl.querySelector('.message').textContent = '';

            // 显示验证码
            document.getElementById('captcha-container').classList.remove('hidden');
            initCaptcha();
        }

        async function initCaptcha() {
            try {
                const response = await fetch(`captcha.php?action=get&index=${currentCaptchaIndex}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || '获取验证码失败');
                }

                currentCaptchaData = result.data;

                // 更新头部图标和文字
                document.querySelector('.captcha-header .icon img').src = currentCaptchaData.cover;
                document.querySelector('.header-desc .desc-text').textContent = currentCaptchaData.title;

                // 更新图片网格
                const imageGrid = document.querySelector('.image-grid');
                imageGrid.innerHTML = '';
                selectedImages.clear();

                // 生成图片网格
                currentCaptchaData.images.forEach((image, index) => {
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'captcha-image-container';
                    imgContainer.innerHTML = `
                        <div class="image-overlay"></div>
                        <img src="${image.src}" alt="验证图片">
                    `;
                    imgContainer.onclick = () => toggleImageSelection(imgContainer, index);
                    imageGrid.appendChild(imgContainer);
                });
            } catch (error) {
                console.error('获取验证码失败:', error);
                alert('获取验证码失败，请重试');
            }
        }

        function toggleImageSelection(container, index) {
            container.classList.toggle('selected');
            if (selectedImages.has(index)) {
                selectedImages.delete(index);
            } else {
                selectedImages.add(index);
            }
        }

        async function verifyCaptcha() {
            try {
                const response = await fetch('captcha.php?action=verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        selectedIndices: Array.from(selectedImages),
                        images: currentCaptchaData.images
                    })
                });

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || '验证失败');
                }

                const resultEl = document.querySelector('.verify-result');
                const successIcon = resultEl.querySelector('.success-icon');
                const errorIcon = resultEl.querySelector('.error-icon');
                const messageEl = resultEl.querySelector('.message');

                // 重置图标显示
                successIcon.style.display = 'none';
                errorIcon.style.display = 'none';

                if (result.valid) {
                    // 显示成功提示
                    successIcon.style.display = 'block';
                    messageEl.textContent = currentCaptchaData.rightTip;
                    resultEl.className = 'verify-result show success';

                    // 延迟后关闭验证码
                    setTimeout(() => {
                        document.getElementById('captcha-container').classList.add('hidden');
                        proceedWithLogin();
                    }, 1500);
                } else {
                    // 显示失败提示
                    errorIcon.style.display = 'block';
                    messageEl.textContent = currentCaptchaData.wrongTip;
                    resultEl.className = 'verify-result show error';

                    // 延迟后重置验证码
                    setTimeout(() => {
                        resultEl.classList.remove('show');
                        initCaptcha();
                    }, 1500);
                }
            } catch (error) {
                console.error('验证失败:', error);
                alert('验证失败，请重试');
            }
        }

        function refreshCaptcha() {
            const refreshBtn = document.querySelector('.refresh-btn');
            refreshBtn.classList.add('rotating');
            initCaptcha().then(() => {
                setTimeout(() => {
                    refreshBtn.classList.remove('rotating');
                }, 500);
            });
        }

        async function proceedWithLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!browserFingerprint) {
                showMessage("环境验证失败，请刷新页面重试", false);
                return;
            }

            const key = String.fromCharCode(0x1f31f) + String.fromCharCode(0x1f308) + "🍎🍌🎮💻"; // 🌟🌈🍎🍌🎮💻
            const validNameHash = CryptoJS.SHA256(validUsername).toString();
            const obfuscatedKey = key.split('').map(c => String.fromCharCode(c.charCodeAt(0) ^ 42)).join('');
            const reversedName = validUsername.split('').reverse().join('');
            const salted = reversedName + obfuscatedKey + validNameHash;
            const finalHash = CryptoJS.MD5(CryptoJS.SHA256(salted).toString()).toString();

            if (username === validUsername && password === finalHash) {
                try {
                    const response = await fetch('login.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            password: finalHash,
                            captchaData: {
                                selectedIndices: Array.from(selectedImages),
                                images: currentCaptchaData.images,
                                index: currentCaptchaIndex
                            },
                            fingerprint: browserFingerprint
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showMessage("登录成功！", true);
                        setTimeout(() => {
                            window.location.href = result.redirect;
                        }, 1000);
                    } else {
                        showMessage(result.message, false);
                    }
                } catch (error) {
                    showMessage("登录失败，请重试", false);
                }
            } else {
                showMessage("用户名或密码错误，请重试！", false);
            }
        }


        function showMessage(text, isSuccess) {
            const message = document.getElementById('message');
            message.style.color = isSuccess ? "#4CAF50" : "#ff4444";
            message.style.display = "block";
            message.textContent = text;
        }

        function showAbout() {
            window.open("http://moejue.cn/", "_blank");
        }

        function skipCaptcha() {
            currentCaptchaIndex = (currentCaptchaIndex + 1) % 3;
            const refreshBtn = document.querySelector('.refresh-btn');
            refreshBtn.classList.add('rotating');
            initCaptcha().then(() => {
                setTimeout(() => {
                    refreshBtn.classList.remove('rotating');
                }, 500);
            });
        }
    </script>
</body>

</html>
