<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿珏酱Blog十周年庆解密游戏</title>
    <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
    <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .intro-container img {
            transition: filter 1.5s ease-out, brightness 0.1s linear;
        }
        .darken {
            filter: brightness(0);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            z-index: 10000;
            font-family: 'Microsoft YaHei', sans-serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            display: block;
        }
        .message.show {
            opacity: 1;
        }
        .char {
            display: inline-block;
            transition: all 0.5s ease-out;
        }
        .char.explode {
            transform: translate(var(--tx), var(--ty)) rotate(var(--rot));
            opacity: 0;
            filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="message">故事开始咯!</div>
    <div id="intro-image" class="intro-container">
        <img src="/images/20200125200224.png" alt="intro" usemap="#intromap">
        <map name="intromap">
            <area shape="rect" coords="1085,889,1117,932" href="/level/1.5/black.html" class="clickable-area" onclick="return handleTransition(event)">
        </map>
    </div>
    <script>
        function splitText() {
            const message = document.querySelector('.message');
            const text = message.textContent;
            message.textContent = '';
            
            for (let char of text) {
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = char;
                message.appendChild(span);
            }
        }

        function explodeText() {
            const chars = document.querySelectorAll('.char');
            chars.forEach(char => {
                const tx = (Math.random() - 0.5) * 500;
                const ty = (Math.random() - 0.5) * 500;
                const rot = (Math.random() - 0.5) * 720;
                
                char.style.setProperty('--tx', `${tx}px`);
                char.style.setProperty('--ty', `${ty}px`);
                char.style.setProperty('--rot', `${rot}deg`);
                char.classList.add('explode');
            });
        }

        function handleTransition(event) {
            event.preventDefault();
            const href = event.target.getAttribute('href');
            const image = document.querySelector('.intro-container img');
            const message = document.querySelector('.message');
            document.querySelector('.intro-container').style.backgroundColor = 'black';
            splitText();
            image.classList.add('darken');
            setTimeout(() => {
                message.classList.add('show');
                setTimeout(() => {
                    explodeText();
                    setTimeout(() => {
                        window.location.href = href;
                    }, 800);
                }, 1500);
            }, 1500);
            return false;
        }
    </script>
</body>
</html>
