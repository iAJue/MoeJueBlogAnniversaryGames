<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>优惠券码</title>
<style>
  :root{
    --table:#6a4028;
    --table-dark: #56321f;
    --paper:#fff;
    --paper-edge:#f1f1f1;
    --shadow: rgba(8,6,6,0.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,var(--table-dark),var(--table));display:flex;align-items:center;justify-content:center;opacity:0;animation:fadeIn 800ms ease forwards}

  @keyframes fadeIn{
    from{opacity:0;transform:scale(0.95)}
    to{opacity:1;transform:scale(1)}
  }

  .stage{
    width:760px;
    max-width:92vw;
    height:520px;
    perspective:1000px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
  }

  .table{
    width:100%;
    height:100%;
    border-radius:12px;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.04) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 6px),
      linear-gradient(180deg, #6f4326, #5a2f18);
    position:relative;
    box-shadow: 0 20px 60px rgba(2,6,23,0.55) inset, 0 18px 40px rgba(0,0,0,0.45);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .paper-wrap{
    width:420px;
    height:260px;
    transform-style:preserve-3d;
    transform: rotateX(6deg) rotateZ(-6deg);
    transition: transform 260ms ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .paper{
    width:100%;
    height:100%;
    background: linear-gradient(180deg, var(--paper), var(--paper-edge));
    border-radius:8px;
    position:relative;
    box-shadow:
      0 18px 40px rgba(2,6,23,0.35),
      0 2px 6px rgba(0,0,0,0.12) inset;
    border:1px solid rgba(0,0,0,0.06);
    overflow:visible;
    transform: translateZ(1px);
  }

  .paper::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:8px;
    background-image:
      linear-gradient(90deg, rgba(0,0,0,0.01) 0.5px, transparent 0.5px),
      linear-gradient(180deg, rgba(0,0,0,0.01) 0.5px, transparent 0.5px);
    opacity:0.06;
    pointer-events:none;
    mix-blend-mode:overlay;
  }

  .paper::after{
    content:"";
    position:absolute;
    right:12px;
    top:12px;
    width:56px;
    height:56px;
    border-radius:8px;
    background: linear-gradient(135deg, rgba(0,0,0,0.02), rgba(255,255,255,0.95));
    transform: rotate(-12deg);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    opacity:0.75;
    pointer-events:none;
  }

  .paper-shadow{
    position:absolute;
    width:420px;
    height:260px;
    border-radius:10px;
    left:50%;
    top:50%;
    transform: translate(-50%,-50%) rotateX(90deg) translateY(28px);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.12) 40%, rgba(0,0,0,0) 70%);
    filter: blur(10px);
    pointer-events:none;
    z-index:0;
  }

  .paper-edge-shadow{
    position:absolute;
    inset:6px;
    border-radius:6px;
    box-shadow:
      0 2px 6px rgba(0,0,0,0.08) inset,
      0 6px 18px rgba(0,0,0,0.06) inset;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#111;
    font-size:15px;
    line-height:1.5;
    font-family: 'Noto Sans','Helvetica Neue',Arial, sans-serif;
    padding:32px;
    text-align:center;
  }
  
  .title{
    font-weight:700;
    font-size:18px;
    margin-bottom:8px;
    color:#333;
  }
  
  .meta{
    font-size:12px;
    color:#666;
    margin-bottom:20px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  
  .coupon-code{
    font-family:'Courier New',monospace;
    font-size:24px;
    font-weight:700;
    color:#1a1a1a;
    letter-spacing:3px;
    padding:16px 24px;
    background:linear-gradient(180deg,#f8f8f8,#ececec);
    border-radius:6px;
    border:2px dashed #999;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:16px;
  }
  
  .note{
    font-size:13px;
    color:#555;
    line-height:1.6;
    max-width:320px;
  }

  @media (max-width:520px){
    .paper-wrap{width:320px;height:200px; transform: rotateX(6deg) rotateZ(-6deg) scale(0.9)}
    .paper-shadow{width:320px;height:200px}
    .coupon-code{font-size:18px;padding:12px 18px}
  }
</style>
</head>
<body>
  <div class="stage" role="img" aria-label="优惠券纸条">
    <div class="table" aria-hidden="false">
      <div class="paper-shadow" aria-hidden="true"></div>

      <div class="paper-wrap">
        <div class="paper" role="article" aria-label="优惠券码">
          <div class="paper-edge-shadow"></div>

          <div class="content">
            <div class="title">恭喜你！</div>
            <div class="meta">优惠券码</div>
            <div class="coupon-code" id="couponCode">加载中...</div>
            <div class="note">请妥善保管此优惠券码，使用时请出示此码。感谢您参与阿珏酱Blog十周年庆解密游戏！</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function() {
      // 从URL参数获取优惠券码
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const couponCodeEl = document.getElementById('couponCode');
      
      if (code) {
        couponCodeEl.textContent = code;
      } else {
        couponCodeEl.textContent = '未找到优惠券码';
      }
    })();
  </script>
</body>
</html>
