<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>画册拼图 - 阿珏酱Blog十周年庆解密游戏</title>
  <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
  <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #eef3ff 0%, #f9fbff 30%, #eef6ff 70%, #e5f0ff 100%);
      --accent: #0f6d9c;
      --panel: rgba(255, 255, 255, 0.9);
      --grid: #d6e2f5;
      --board: #f2f6fd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: #0f1c2e;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1620px;
      margin: 16px auto;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(15, 31, 52, 0.12);
      overflow: hidden;
      border: 1px solid #dbe6f5;
    }

    header {
      padding: 12px 16px;
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #dbe6f5;
      z-index: 3;
    }

    header h1 {
      font-size: 16px;
      margin: 0 12px 0 0;
      letter-spacing: 0.5px;
    }

    .hint {
      font-size: 13px;
      color: #4a5c75;
      margin-left: auto;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    input[type="number"] {
      width: 56px;
      padding: 6px 8px;
      border: 1px solid #c8d7eb;
      border-radius: 6px;
      background: #fff;
    }

    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #fff;
      color: #0f1c2e;
      border: 1px solid #c8d7eb;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 800px;
      max-height: 80vh;
      overflow: hidden;
      background: linear-gradient(135deg, #f7f9ff 0%, #eef4ff 100%);
    }

    #board {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--board);
      border: 2px dashed var(--grid);
      box-shadow: 0 10px 30px rgba(15, 31, 52, 0.1);
      transition: width 0.2s ease, height 0.2s ease;
    }

    #board::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: var(--cell-w) var(--cell-h), var(--cell-w) var(--cell-h);
      opacity: 0.8;
      pointer-events: none;
    }

    .piece {
      position: absolute;
      user-select: none;
      touch-action: none;
      cursor: grab;
      filter: drop-shadow(0 5px 12px rgba(15, 31, 52, 0.25));
      transition: transform 0.15s ease;
    }

    .piece.dragging {
      cursor: grabbing;
      transform: scale(1.03);
      z-index: 10;
    }

    .toast {
      position: absolute;
      right: 16px;
      bottom: 16px;
      background: #0f1c2e;
      color: #f6f8fb;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(15, 31, 52, 0.22);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .github-corner svg {
      fill: var(--accent);
      color: #fff;
      position: fixed;
      top: 0;
      left: 0;
      border: 0;
      z-index: 999999;
      transform: scale(-1, 1);
    }

    .github-corner:hover .octo-arm,
    .github-corner:focus .octo-arm {
      animation: octo-wave 560ms ease-in-out;
    }

    @keyframes octo-wave {

      0%,
      100% {
        transform: rotate(0);
      }

      20%,
      60% {
        transform: rotate(-25deg);
      }

      40%,
      80% {
        transform: rotate(10deg);
      }
    }

    @media (max-width: 500px) {
      .github-corner:hover .octo-arm {
        animation: none;
      }

      .github-corner .octo-arm {
        animation: octo-wave 560ms ease-in-out;
      }
    }

    footer {
      padding: 12px 16px;
      border-top: 1px solid #dbe6f5;
      background: rgba(255, 255, 255, 0.75);
      text-align: center;
      font-size: 13px;
      color: #4a5c75;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <a href="https://github.com/iAJue/Puzzles" class="github-corner" title="Fork me on GitHub" target="_blank">
    <svg width="60" height="60" viewBox="0 0 250 250" aria-hidden="true">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>

        d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
        fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
      <path
        d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
        fill="currentColor" class="octo-body"></path>
    </svg>
  </a>
  <div class="wrap">
    <header>
      <h1>本地拼图</h1>
      <label class="field">
        <span>选择碎片文件夹:</span>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
      </label>
      <label class="field">
        <span>行:</span><input type="number" id="rowsInput" value="3" min="1">
      </label>
      <label class="field">
        <span>列:</span><input type="number" id="colsInput" value="4" min="1">
      </label>
      <button id="shuffleBtn" class="secondary">重新散落</button>
      <button id="verifyBtn" disabled>提交验证</button>
      <div class="hint">拖动碎片到中间网格，靠近正确格子会吸附</div>
    </header>

    <div id="stage">
      <div id="board"></div>
      <div class="toast" id="toast"></div>
    </div>
    <footer>
      © <a href="https://moejue.cn/" target="_blank">阿珏Blog</a>
    </footer>
  </div>

  <script>
    const folderInput = document.getElementById("folderInput");
    const rowsInput = document.getElementById("rowsInput");
    const colsInput = document.getElementById("colsInput");
    const stage = document.getElementById("stage");
    const board = document.getElementById("board");
    const toast = document.getElementById("toast");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const hintEl = document.querySelector("header .hint");
    const defaultHintText = hintEl ? hintEl.textContent : "";

    let pieces = [];
    let pieceFiles = [];
    const fileHashCache = new Map();
    let currentRows = 0;
    let currentCols = 0;
    let isSubmitting = false;
    let cellW = 120;
    let cellH = 120;
    const sizeScale = 0.5; // 缩小板单元和部件渲染尺寸
    const gridTightnessX = 0.62; // <1 使左右更紧密（减小列间距）
    const gridTightnessY = 0.54; // <1 使上下更紧密（减小行间距）
    const colGap = 2; // 每一列额外间距（px）：让“下一张”整体往右偏移
    const rowGap = 0; // 每一行额外间距（px）
    const snapOffsetX = 0; // 吸附后额外偏移（px），例如 -2/+2
    const snapOffsetY = 0; // 吸附后额外偏移（px），例如 -2/+2
    let boardRect = null;
    let dragState = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function bufferToHex(buffer) {
      return Array.from(new Uint8Array(buffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    async function sha256HexFromFile(file) {
      if (!window.crypto?.subtle) {
        throw new Error("WebCryptoNotSupported");
      }
      const key = `${file.webkitRelativePath || file.name}::${file.size}::${file.lastModified}`;
      if (fileHashCache.has(key)) return fileHashCache.get(key);
      const bytes = await file.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const hex = bufferToHex(digest);
      fileHashCache.set(key, hex);
      return hex;
    }

    function getPieceFile(piece) {
      const idx = piece.dataset.index ? parseInt(piece.dataset.index, 10) : NaN;
      if (Number.isNaN(idx)) return null;
      return pieceFiles[idx] || null;
    }

    function getCurrentBoardOrder() {
      if (!pieces.length) return { ok: false, reason: "请先选择碎片文件夹" };
      const rows = currentRows;
      const cols = currentCols;
      if (!rows || !cols) return { ok: false, reason: "网格尚未初始化" };

      const expectedCount = rows * cols;
      if (pieces.length !== expectedCount) {
        return { ok: false, reason: `碎片数量(${pieces.length})与网格(${rows}×${cols})不匹配` };
      }

      boardRect = board.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const boardLeft = boardRect.left - stageRect.left;
      const boardTop = boardRect.top - stageRect.top;
      const boardRight = boardRect.right - stageRect.left;
      const boardBottom = boardRect.bottom - stageRect.top;

      const stepX = cellW + colGap;
      const stepY = cellH + rowGap;
      const order = Array(expectedCount).fill(null);

      for (const piece of pieces) {
        const { w, h } = getPieceSize(piece);
        const left = parseFloat(piece.style.left) || 0;
        const top = parseFloat(piece.style.top) || 0;
        const centerX = left + w / 2;
        const centerY = top + h / 2;

        const inside = centerX >= boardLeft &&
          centerX <= boardRight &&
          centerY >= boardTop &&
          centerY <= boardBottom;
        if (!inside) return { ok: false, reason: "请先把所有碎片拖到网格内" };

        const localX = centerX - boardLeft;
        const localY = centerY - boardTop;
        const col = Math.round(localX / stepX - 0.5);
        const row = Math.round(localY / stepY - 0.5);
        if (row < 0 || row >= rows || col < 0 || col >= cols) {
          return { ok: false, reason: "碎片没有正确对齐到网格，请稍微调整后再提交" };
        }

        const cellIndex = row * cols + col;
        if (order[cellIndex]) return { ok: false, reason: "有多个碎片落在同一个格子，请调整后再提交" };
        order[cellIndex] = piece;
      }

      if (order.some(v => !v)) return { ok: false, reason: "网格未填满，请继续拼图后再提交" };
      return { ok: true, rows, cols, order };
    }

    function updateVerifyButtonState() {
      if (!verifyBtn) return;
      const status = getCurrentBoardOrder();
      verifyBtn.disabled = isSubmitting;
      if (hintEl) {
        hintEl.textContent = status.ok ? defaultHintText : status.reason;
      }
    }

    folderInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []).filter(f => /\.(png|jpg|jpeg|webp)$/i.test(f.name));
      if (!files.length) return;
      verifyBtn.disabled = true;
      const parsed = parseGridFromNames(files);
      if (parsed) {
        if (!rowsInput.value) rowsInput.value = parsed.rows;
        if (!colsInput.value) colsInput.value = parsed.cols;
      }
      const data = await Promise.all(files.map(loadImageFile));
      spawnPieces(data);
      showToast(`已载入 ${data.length} 个碎片`);
    });

    shuffleBtn.addEventListener("click", () => scatterPieces());
    verifyBtn.addEventListener("click", () => submitPuzzle());

    function parseGridFromNames(files) {
      let maxR = -1, maxC = -1, count = 0;
      const pattern = /r(\d+)_c(\d+)/i;
      for (const f of files) {
        const m = f.name.match(pattern);
        if (m) {
          maxR = Math.max(maxR, parseInt(m[1], 10));
          maxC = Math.max(maxC, parseInt(m[2], 10));
          count++;
        }
      }
      if (count === 0) return null;
      return { rows: maxR + 1, cols: maxC + 1 };
    }

    function loadImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve({ file, src: reader.result, w: img.naturalWidth, h: img.naturalHeight });
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function spawnPieces(data) {
      stage.querySelectorAll(".piece").forEach(el => el.remove());
      pieces = [];
      pieceFiles = data.map(item => item.file);
      fileHashCache.clear();

      const rows = Math.max(1, parseInt(rowsInput.value, 10) || 3);
      const cols = Math.max(1, parseInt(colsInput.value, 10) || 4);
      currentRows = rows;
      currentCols = cols;

      const avgW = Math.max(40, Math.round(data.reduce((s, d) => s + d.w, 0) / data.length));
      const avgH = Math.max(40, Math.round(data.reduce((s, d) => s + d.h, 0) / data.length));
      const avgDisplayW = Math.max(24, Math.round(avgW * sizeScale));
      const avgDisplayH = Math.max(24, Math.round(avgH * sizeScale));
      cellW = Math.max(24, Math.round(avgDisplayW * gridTightnessX));
      cellH = Math.max(24, Math.round(avgDisplayH * gridTightnessY));
      const stepX = cellW + colGap;
      const stepY = cellH + rowGap;

      board.style.setProperty("--cell-w", `${stepX}px`);
      board.style.setProperty("--cell-h", `${stepY}px`);
      board.style.width = `${cols * cellW + Math.max(0, cols - 1) * colGap}px`;
      board.style.height = `${rows * cellH + Math.max(0, rows - 1) * rowGap}px`;
      boardRect = board.getBoundingClientRect();

      data.forEach((item, i) => {
        const piece = document.createElement("img");
        piece.src = item.src;
        piece.className = "piece";
        piece.draggable = false;
        piece.dataset.index = i;
        const displayW = Math.max(24, Math.round(item.w * sizeScale));
        const displayH = Math.max(24, Math.round(item.h * sizeScale));
        piece.style.width = `${displayW}px`;
        piece.style.height = `${displayH}px`;
        piece.dataset.displayW = displayW;
        piece.dataset.displayH = displayH;
        const match = item.file.name.match(/r(\d+)_c(\d+)/i);
        if (match) {
          piece.dataset.targetRow = parseInt(match[1], 10);
          piece.dataset.targetCol = parseInt(match[2], 10);
        }
        stage.appendChild(piece);
        pieces.push(piece);
      });

      requestAnimationFrame(scatterPieces);
    }

    function scatterPieces() {
      const stageRect = stage.getBoundingClientRect();
      boardRect = board.getBoundingClientRect();
      const margin = 24;

      pieces.forEach((piece, idx) => {
        const { w, h } = getPieceSize(piece);
        const side = idx % 4;
        let x, y;
        switch (side) {
          case 0: // top
            x = rand(margin, stageRect.width - margin - w);
            y = rand(margin, Math.max(margin, boardRect.top - stageRect.top - h - 10));
            break;
          case 1: // right
            x = rand(Math.min(stageRect.width - margin - w, boardRect.right - stageRect.left + 10), stageRect.width - margin - w);
            y = rand(margin, stageRect.height - margin - h);
            break;
          case 2: // bottom
            x = rand(margin, stageRect.width - margin - w);
            y = rand(Math.min(stageRect.height - margin - h, boardRect.bottom - stageRect.top + 10), stageRect.height - margin - h);
            break;
          default: // left
            x = rand(margin, Math.max(margin, boardRect.left - stageRect.left - w - 10));
            y = rand(margin, stageRect.height - margin - h);
        }
        placePiece(piece, x, y);
      });
      updateVerifyButtonState();
    }

    function placePiece(piece, x, y) {
      const { w, h } = getPieceSize(piece);
      const stageRect = stage.getBoundingClientRect();
      const minX = 4;
      const minY = 4;
      const maxX = Math.max(minX, stageRect.width - w - 4);
      const maxY = Math.max(minY, stageRect.height - h - 4);
      const clampedX = Math.min(maxX, Math.max(minX, x));
      const clampedY = Math.min(maxY, Math.max(minY, y));
      piece.style.left = `${clampedX}px`;
      piece.style.top = `${clampedY}px`;
    }

    function rand(min, max) {
      if (max <= min) return min;
      return Math.max(min, Math.min(max, min + Math.random() * (max - min)));
    }

    stage.addEventListener("pointerdown", (e) => {
      const piece = e.target.closest(".piece");
      if (!piece) return;
      piece.setPointerCapture(e.pointerId);
      dragState = {
        piece,
        startX: e.clientX,
        startY: e.clientY,
        baseLeft: parseFloat(piece.style.left) || 0,
        baseTop: parseFloat(piece.style.top) || 0,
      };
      piece.classList.add("dragging");
      piece.style.zIndex = 20;
    });

    stage.addEventListener("pointermove", (e) => {
      if (!dragState) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      const x = dragState.baseLeft + dx;
      const y = dragState.baseTop + dy;
      placePiece(dragState.piece, x, y);
    });

    stage.addEventListener("pointerup", (e) => finishDrag(e));
    stage.addEventListener("pointercancel", (e) => finishDrag(e));

    function finishDrag(e) {
      if (!dragState) return;
      const { piece } = dragState;
      piece.releasePointerCapture(e.pointerId);
      piece.classList.remove("dragging");
      piece.style.zIndex = 5;

      snapPiece(piece);
      dragState = null;
      updateVerifyButtonState();
    }

    function snapPiece(piece) {
      boardRect = board.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const { w, h } = getPieceSize(piece);
      const px = parseFloat(piece.style.left) || 0;
      const py = parseFloat(piece.style.top) || 0;
      const centerX = px + w / 2;
      const centerY = py + h / 2;

      const inside = centerX >= (boardRect.left - stageRect.left) &&
        centerX <= (boardRect.right - stageRect.left) &&
        centerY >= (boardRect.top - stageRect.top) &&
        centerY <= (boardRect.bottom - stageRect.top);

      if (!inside) return;

      const localX = centerX - (boardRect.left - stageRect.left);
      const localY = centerY - (boardRect.top - stageRect.top);

      const stepX = cellW + colGap;
      const stepY = cellH + rowGap;
      let snapX = (Math.round(localX / stepX - 0.5) + 0.5) * stepX;
      let snapY = (Math.round(localY / stepY - 0.5) + 0.5) * stepY;

      const targetRow = piece.dataset.targetRow ? parseInt(piece.dataset.targetRow, 10) : null;
      const targetCol = piece.dataset.targetCol ? parseInt(piece.dataset.targetCol, 10) : null;
      if (targetRow !== null && targetCol !== null) {
        const goalX = (targetCol + 0.5) * stepX;
        const goalY = (targetRow + 0.5) * stepY;
        const dist = Math.hypot(localX - goalX, localY - goalY);
        const tolerance = 0.35 * Math.min(cellW, cellH);
        if (dist < tolerance) {
          snapX = goalX;
          snapY = goalY;
        }
      }

      const finalLeft = snapX - w / 2 + (boardRect.left - stageRect.left) + snapOffsetX;
      const finalTop = snapY - h / 2 + (boardRect.top - stageRect.top) + snapOffsetY;
      placePiece(piece, finalLeft, finalTop);
    }

    function getPieceSize(piece) {
      const w = parseFloat(piece.dataset.displayW) || piece.naturalWidth;
      const h = parseFloat(piece.dataset.displayH) || piece.naturalHeight;
      return { w, h };
    }

    async function submitPuzzle() {
      if (isSubmitting) return;

      const res = getCurrentBoardOrder();
      if (!res.ok) {
        showToast(res.reason);
        updateVerifyButtonState();
        return;
      }

      let originalText = verifyBtn.textContent;
      isSubmitting = true;
      verifyBtn.disabled = true;
      verifyBtn.textContent = "提交中...";

      try {
        const hashes = await Promise.all(res.order.map(async (piece) => {
          const file = getPieceFile(piece);
          if (!file) throw new Error("MissingPieceFile");
          return sha256HexFromFile(file);
        }));

        const response = await fetch("/level/puzzles/index.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rows: res.rows, cols: res.cols, hashes }),
        });

        if (response.redirected) {
          window.location.href = response.url;
          return;
        }

        let payload = null;
        try {
          payload = await response.json();
        } catch {
          payload = null;
        }

        if (payload && typeof payload.redirect === "string" && payload.redirect) {
          window.location.href = payload.redirect;
          return;
        }

        const msg = (payload && typeof payload.message === "string" && payload.message.trim())
          ? payload.message.trim()
          : (response.ok ? "已提交" : `请求失败 (${response.status})`);

        if (!response.ok) {
          showToast(msg);
          return;
        }

        showToast(msg);
      } catch (err) {
        console.error(err);
        if (err?.message === "WebCryptoNotSupported") {
          showToast("当前环境不支持 SHA-256（需要 https/localhost）");
        } else {
          showToast("提交失败，请查看控制台");
        }
      } finally {
        isSubmitting = false;
        verifyBtn.textContent = originalText;
        updateVerifyButtonState();
      }
    }
  </script>
</body>

</html>
