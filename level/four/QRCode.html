<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>扫码进入下一关 - 阿珏酱Blog十周年庆解密游戏</title>
  <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
  <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      color: #333;
    }
    p {
      margin: 1rem;
      font-size: 1.1rem;
    }
    .main-qrcode {
      width: min(300px, 70vw);
      height: auto;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      background: #fff;
      padding: 12px;
    }
    .qrcode-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .puzzle-side-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .puzzle-side-image {
      position: fixed;
      width: clamp(110px, 16vw, 220px);
      height: auto;
      opacity: 0.92;
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.35));
    }
    .puzzle-side-image.left {
      left: clamp(-90px, -7vw, -34px);
    }
    .puzzle-side-image.right {
      right: clamp(-90px, -7vw, -34px);
    }
    .puzzle-2 { top: 36vh; --base-rot: 12deg; animation-duration: 6.1s; animation-delay: -2.4s; }
    .puzzle-4 { top: 14vh; --base-rot: 17deg; animation-duration: 6.4s; animation-delay: -1.8s; }
  </style>
</head>
<body>
  <div class="puzzle-side-layer" aria-hidden="true">
    <img class="puzzle-side-image left puzzle-2" src="../../images/puzzles/fsfds.png" alt="" />
    <img class="puzzle-side-image right puzzle-4" src="../../images/puzzles/8686.png" alt="" />
  </div>
  <div class="qrcode-content">
  <p>这关来点简单的吧,扫个码就能获取下一关的地址。</p>
  <img class="main-qrcode" src="../../images/qrcode.png" />
  <p>请扫描二维码继续挑战。</p>
  </div>
</body>
</html>
