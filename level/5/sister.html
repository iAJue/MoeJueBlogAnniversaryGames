<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第五关 - 殊途同归 - 阿珏酱Blog十周年庆解密游戏</title>
    <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
    <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        .content-layer {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a1a; 
        }

        .images-container {
            display: flex;
            justify-content: center;
            gap: 150px; 
            margin-bottom: 20px;
            position: relative;
        }

        .image-box {
            position: relative;
            width: 500px;
            height: 500px;
            border: 4px solid #4ecca3;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .image-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(78, 204, 163, 0.6);
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .arrows-container {
            height: 100px;
            width: 600px; 
            position: relative;
            display: flex;
            justify-content: center;
        }

        .arrow {
            position: absolute;
            top: 10px;
            width: 4px;
            height: 80px;
            background: linear-gradient(to bottom, #4ecca3, transparent);
        }

        .arrow-left {
            left: 130px; 
            transform: rotate(-30deg);
            background: linear-gradient(to bottom, #4ecca3, #4ecca3);
            height: 100px;
            width: 3px;
        }
        
        .arrow-right {
            right: 130px; 
            transform: rotate(30deg);
            background: linear-gradient(to bottom, #4ecca3, #4ecca3);
            height: 100px;
            width: 3px;
        }

        .arrows-svg {
            width: 550px;
            height: 120px;
            filter: drop-shadow(0 0 5px #4ecca3);
        }
        
        .arrow-path {
            stroke: #4ecca3;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
        }

        .arrow-head {
            fill: #4ecca3;
        }

        .or-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .input-area {
            margin-top: 30px;
            position: relative;
            width: 400px;
        }

        .input-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #4ecca3;
            border-radius: 5px;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .input-box:focus {
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.4);
        }

        .submit-btn {
            position: absolute;
            right: -39px;
            top: 5px;
            bottom: 5px;
            padding: 0 20px;
            background: #4ecca3;
            border: none;
            border-radius: 3px;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #fff;
        }

        .hint {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .hint a {
            color: #4ecca3;
            text-decoration: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #4ecca3;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(78, 204, 163, 0.2);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h2 { color: #4ecca3; }
        
        .close-btn {
            background: transparent;
            border: 1px solid #666;
            color: #fff;
            padding: 10px 30px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .close-btn:hover { border-color: #4ecca3; color: #4ecca3; }

    </style>
</head>
<body>
    <div class="content-layer">
        <div class="hint">看,左边是一张我妹的照片,右边也有一张,她叫高坂桐乃(こうさか きりの),我很喜欢她!</div>

        <div class="images-container">
            <div class="image-box" onclick="showDetail('A')">
                <img src="/images/高坂桐乃.jpg">
            </div>
            <div class="image-box" onclick="showDetail('B')">
                <img src="/images/こうさか きりの.jpg">
            </div>
        </div>

        <div class="arrows-container">
            <div class="or-text">OR</div>

            <svg class="arrows-svg" viewBox="0 0 550 120">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                    refX="0" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7" fill="#4ecca3" />
                    </marker>
                </defs>
                <path d="M 100 10 L 250 110" class="arrow-path" marker-end="url(#arrowhead)"/>
                <path d="M 450 10 L 300 110" class="arrow-path" marker-end="url(#arrowhead)"/>
            </svg>
        </div>

        <div class="input-area">
            <input type="text" id="answer" class="input-box" placeholder="这是一个固定的密码" onkeypress="checkEnter(event)">
            <button class="submit-btn" onclick="submitAnswer()">确认</button>
        </div>

        <div class="hint"><a href="https://moejue.cn/archives/97" target="_blank">我老妹在三周年的时候也过来为我捧过场</a></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-msg"></p>
            <button class="close-btn" onclick="closeModal()">关闭</button>
            <button class="close-btn" id="next-btn" style="display:none; border-color:#4ecca3; color:#4ecca3; margin-left:10px;" onclick="nextLevel()">下一关</button>
        </div>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === "Enter") {
                submitAnswer();
            }
        }

        async function submitAnswer() {
            const val = document.getElementById('answer').value.trim();
            if (!val) {
                showModal("提示", "输入点什么吧", false);
                return;
            }

            const data = {
                answer: val
            };

            try {
                const response = await fetch('/level/5/submit.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    showModal("回答正确", "没错，它们是一样的！", true);
                } else {
                    showModal("不对哦，再仔细看看。", "虽然不知道怎么回事,但还是不能让你过去", false);
                }

            } catch (e) {
                showModal("不知道", "虽然网络有点小问题，但我相信你的判断！", false);
            }
        }

        function showModal(title, msg, success) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').style.display = 'flex';
            
            const nextBtn = document.getElementById('next-btn');
            if (success) {
                nextBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'none';
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function nextLevel() {
            alert("即将前往下一关...");
            // window.location.href = '/level/last/safe.html';
        }

        function showDetail(type) {
            console.log("Clicked image " + type);
        }
    </script>
</body>
</html>
