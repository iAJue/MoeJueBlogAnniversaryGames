            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const imgWidth = img.offsetWidth;

        document.addEventListener(
            "contextmenu",
            function (e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            },
            true
        );

        document.addEventListener(
            "keydown",
            function (e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            },
            true
        );

        document.addEventListener(
            "keyup",
            function (e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            },
            true
        );

        document.addEventListener(
            "keypress",
            function (e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            },
            true
        );

        const mouseEvents = [
            "click",
            "dblclick",
            "mousedown",
            "mouseup",
            "mousemove",
            "mouseover",
            "mouseout",
            "mouseenter",
            "mouseleave",
            "wheel",
        ];
        mouseEvents.forEach(function (eventType) {
            document.addEventListener(
                eventType,
                function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                },
                true
            );
        });

        const touchEvents = [
            "touchstart",
            "touchmove",
            "touchend",
            "touchcancel",
        ];
        touchEvents.forEach(function (eventType) {
            document.addEventListener(
                eventType,
                function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                },
                true
            );
        });

        document.addEventListener(
            "selectstart",
            function (e) {
                e.preventDefault();
                return false;
            },
            true
        );

        document.addEventListener(
            "dragstart",
            function (e) {
                e.preventDefault();
                return false;
            },
            true
        );

        (function () {
            let devtoolsOpen = false;
            const threshold = 160;

            const checkDevTools = function () {
                const widthThreshold =
                    window.outerWidth - window.innerWidth > threshold;
                const heightThreshold =
                    window.outerHeight - window.innerHeight > threshold;

                if (widthThreshold || heightThreshold) {
                    if (!devtoolsOpen) {
                        devtoolsOpen = true;
                        handleDevToolsOpen();
                    }
                } else {
                    devtoolsOpen = false;
                }
            };

            const detectDebugger = function () {
                const start = new Date();
                debugger;
                const end = new Date();
                if (end - start > 100) {
                    handleDevToolsOpen();
                }
            };

            const detectConsole = function () {
                const element = new Image();
                Object.defineProperty(element, "id", {
                    get: function () {
                        handleDevToolsOpen();
                        throw new Error("DevTools detected");
                    },
                });
                console.log(element);
            };

            function handleDevToolsOpen() {
                document.body.innerHTML = "";
                window.location.href = "about:blank";
            }

            document.addEventListener(
                "keydown",
                function (e) {
                    if (e.keyCode === 123) {
                        e.preventDefault();
                        handleDevToolsOpen();
                        return false;
                    }
                    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                        e.preventDefault();
                        handleDevToolsOpen();
                        return false;
                    }
                    if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                        e.preventDefault();
                        handleDevToolsOpen();
                        return false;
                    }
                    if (e.ctrlKey && e.keyCode === 85) {
                        e.preventDefault();
                        handleDevToolsOpen();
                        return false;
                    }
                    if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                        e.preventDefault();
                        handleDevToolsOpen();
                        return false;
                    }
                },
                true
            );

            setInterval(checkDevTools, 500);
            setInterval(detectDebugger, 500);

            window.addEventListener("load", checkDevTools);
            window.addEventListener("resize", checkDevTools);
        })();
