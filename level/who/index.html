<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>猜猜我是谁 - 阿珏酱Blog十周年庆解密游戏</title>
  <meta name="description" content="阿珏酱Blog十周年庆解密游戏：猜猜我是谁（剪影关卡）" />
  <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 猜猜我是谁, 剪影, 轮廓图" />
  <style>
    :root {
      --bg0: #070b14;
      --bg1: #0b1230;
      --stroke: rgba(255, 255, 255, 0.10);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.62);
      --shadow: rgba(0, 0, 0, 0.35);
      --accent: #7c3aed;
      --ok: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(800px 500px at 20% 15%, rgba(124, 58, 237, 0.35), transparent 55%),
        radial-gradient(700px 520px at 80% 80%, rgba(34, 197, 94, 0.18), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
    }

    .wrap {
      width: min(980px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      align-items: stretch;
      margin: 50px;
    }

    @media (max-width: 860px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
      border: 1px solid var(--stroke);
      border-radius: 16px;
      box-shadow: 0 20px 60px var(--shadow);
      overflow: hidden;
    }

    .card-hd {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .card-hd h1 {
      font-size: 16px;
      margin: 0;
      letter-spacing: 0.6px;
    }

    .card-hd .sub {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }

    .stage {
      padding: 18px;
      display: grid;
      place-items: center;
      min-height: 420px;
      position: relative;
      background:
        radial-gradient(500px 280px at 50% 65%, rgba(0, 0, 0, 0.32), transparent 70%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent);
    }

    .frame {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background:
        radial-gradient(300px 220px at 50% 25%, rgba(255, 255, 255, 0.06), transparent 70%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
      border: 1px dashed rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      padding: 12px;
      isolation: isolate;
      transition: box-shadow 280ms ease, border-color 280ms ease, transform 280ms ease;
    }

    .scan {
      position: absolute;
      inset: -60% -30%;
      background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.14), transparent);
      transform: rotate(18deg);
      animation: scan 3.6s ease-in-out infinite;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 1;
      transition: opacity 260ms ease;
    }

    @keyframes scan {
      0% {
        transform: translateX(-40%) rotate(18deg);
      }

      60% {
        transform: translateX(35%) rotate(18deg);
      }

      100% {
        transform: translateX(35%) rotate(18deg);
      }
    }

    .photo {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: brightness(0) saturate(100%) contrast(130%);
      opacity: 0.98;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      transition: filter 700ms ease, transform 520ms ease, opacity 520ms ease;
    }

    .frame.reveal {
      border-color: rgba(34, 197, 94, 0.55);
      box-shadow: 0 22px 70px rgba(34, 197, 94, 0.12), 0 18px 60px var(--shadow);
      animation: pop 520ms cubic-bezier(.22, 1, .36, 1);
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.02);
      }

      100% {
        transform: scale(1);
      }
    }

    .frame.reveal .scan {
      opacity: 0;
      animation: none;
    }

    .frame.reveal .photo {
      filter: none;
      opacity: 1;
      transform: scale(1.01);
    }

    .frame.reveal::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: rotate(18deg) translateX(-40%);
      animation: sweep 900ms ease-out 1;
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
    }

    @keyframes sweep {
      0% {
        opacity: 0;
        transform: rotate(18deg) translateX(-55%);
      }

      25% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: rotate(18deg) translateX(55%);
      }
    }

    .panel {
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: 0.4px;
    }

    .panel p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row input {
      flex: 1;
      padding: 12px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      outline: none;
    }

    .row input:focus {
      border-color: rgba(124, 58, 237, 0.55);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.18);
    }

    .row button {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.85), rgba(124, 58, 237, 0.55));
      color: white;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .row button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
      color: var(--muted);
    }

    .result.ok {
      color: rgba(34, 197, 94, 0.9);
    }

    .result.bad {
      color: rgba(248, 113, 113, 0.92);
    }

    footer {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
    }

    .next {
      margin-top: 10px;
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      cursor: pointer;
    }

    .next.show {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border-color: rgba(34, 197, 94, 0.32);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="card">
      <div class="card-hd">
        <h1>猜猜我是谁</h1>
        <div class="sub">不认识？刷新页面看看</div>
      </div>
      <div class="stage">
        <div class="frame" id="frame">
          <div class="scan" aria-hidden="true"></div>
          <img id="whoImage" class="photo" src="random-image.php" alt="silhouette" draggable="false" />
        </div>
      </div>
    </section>

    <aside class="card">
      <div class="card-hd">
        <h1>输入答案</h1>
        <div class="sub">支持中文 / 英文 / 日语</div>
      </div>
      <div class="panel">
        <h2>你觉得这个人是谁？</h2>
        <p>把你猜到的名字输入进去。答对就会给你下一关的入口。</p>

        <div class="row">
          <input id="answer" type="text" autocomplete="off" placeholder="例如：阿珏酱 / MoeJue" />
          <button id="submitBtn">确认</button>
        </div>

        <div id="result" class="result" aria-live="polite"></div>
        <button id="nextBtn" class="next" type="button">下一关</button>

        <footer>阿珏酱Blog十周年庆解密游戏</footer>
      </div>
    </aside>
  </div>

  <script>
    const answerEl = document.getElementById("answer");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultEl = document.getElementById("result");
    const frameEl = document.getElementById("frame");

    let isSubmitting = false;
    let redirectUrl = "";

    function setResult(text, kind) {
      resultEl.textContent = text || "";
      resultEl.className = "result" + (kind ? (" " + kind) : "");
    }

    function setSubmitting(on) {
      isSubmitting = on;
      submitBtn.disabled = on;
      submitBtn.textContent = on ? "验证中..." : "确认";
    }

    function reveal() {
      if (!frameEl) return;
      frameEl.classList.add("reveal");
    }

    async function submit() {
      if (isSubmitting) return;
      const answer = (answerEl.value || "").trim();
      if (!answer) {
        setResult("先输入一个名字吧。", "bad");
        return;
      }

      setSubmitting(true);
      setResult("", "");
      nextBtn.classList.remove("show");
      redirectUrl = "";

      try {
        const response = await fetch("verify.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ answer }),
        });

        if (response.redirected) {
          window.location.href = response.url;
          return;
        }

        let payload = null;
        try {
          payload = await response.json();
        } catch {
          payload = null;
        }

        const msg = (payload && typeof payload.message === "string")
          ? payload.message
          : (response.ok ? "已提交" : `请求失败 (${response.status})`);

        const ok = !!(payload && payload.success === true);
        redirectUrl = (payload && typeof payload.redirect === "string") ? payload.redirect : "";

        if (!response.ok || !ok) {
          setResult(msg, "bad");
          return;
        }

        setResult(msg, "ok");
        reveal();
        if (redirectUrl) nextBtn.classList.add("show");
      } catch (err) {
        console.error(err);
        setResult("提交失败，请检查控制台或服务器状态。", "bad");
      } finally {
        setSubmitting(false);
      }
    }

    submitBtn.addEventListener("click", submit);
    answerEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });

    nextBtn.addEventListener("click", () => {
      if (redirectUrl) window.location.href = redirectUrl;
    });
  </script>
</body>

</html>
