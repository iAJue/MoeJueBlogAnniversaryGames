<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年龄确认 - 阿珏酱Blog十周年庆解密游戏</title>
    <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
    <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #1a1a1a;
            overflow: hidden;
            position: relative;
        }

        /* 年龄验证容器 */
        .age-gate-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .age-gate-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .age-gate-box {
            background: #2a2a2a;
            padding: 3rem 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #3a3a3a;
        }

        .warning-icon {
            font-size: 60px;
            margin-bottom: 1.5rem;
        }

        .age-gate-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 1rem;
        }

        .age-gate-subtitle {
            font-size: 1rem;
            color: #b0b0b0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .age-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .age-btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #2a2a2a;
            color: #e0e0e0;
        }

        .age-btn:hover {
            background: #e0e0e0;
            color: #1a1a1a;
        }

        .age-btn:active {
            transform: scale(0.98);
        }

        .fun-text {
            font-size: 0.9rem;
            color: #666;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="age-gate-container" id="ageGate">
        <div class="age-gate-box">
            <div class="warning-icon">🔞</div>
            <h1 class="age-gate-title">年龄确认</h1>
            <p class="age-gate-subtitle">
                根据阿珏酱的要求，<br>
                本游戏内容可能包含令人兴奋的挑战和刺激的谜题。<br>
                请确认您的年龄是否符合要求。
            </p>
            <div class="age-buttons">
                <button class="age-btn" onclick="handleAgeConfirm(true)">我已满18岁</button>
                <button class="age-btn" onclick="handleAgeConfirm(false)">我未满18岁</button>
            </div>
            <p class="fun-text">* 诚实是一种美德哦 😊</p>
        </div>
    </div>

    <script>
        function handleAgeConfirm(isAdult) {
            document.body.style.transition = 'opacity 0.3s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'GalGame.html?adult=' + isAdult;
            }, 300);
        }

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
