<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年龄确认 - 阿珏酱Blog十周年庆解密游戏</title>
    <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
    <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }

        /* 背景动画粒子 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(var(--drift)) rotate(360deg);
                opacity: 0;
            }
        }

        /* 年龄验证容器 */
        .age-gate-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .age-gate-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .age-gate-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .age-gate-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 200% 100%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .warning-icon {
            font-size: 80px;
            margin-bottom: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .age-gate-title {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .age-gate-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .age-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .age-btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .age-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .age-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .age-btn span {
            position: relative;
            z-index: 1;
        }

        .btn-yes {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-no {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-no:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .age-btn:active {
            transform: translateY(0);
        }

        /* 结果页面 */
        .result-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            z-index: 2;
        }

        .result-container.show {
            opacity: 1;
            visibility: visible;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(10px);
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-container.show .result-box {
            transform: scale(1);
        }

        .result-icon {
            font-size: 100px;
            margin-bottom: 1.5rem;
            animation: bounceIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-message {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .result-image {
            max-width: 100%;
            border-radius: 15px;
            margin: 2rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .continue-btn {
            padding: 1rem 3rem;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-top: 1rem;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .continue-btn:active {
            transform: translateY(0);
        }

        /* 未成年结果特殊样式 */
        .result-underage {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .result-underage .result-title {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 成年结果特殊样式 */
        .result-adult {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .countdown {
            font-size: 3rem;
            font-weight: bold;
            color: #f5576c;
            margin: 1rem 0;
            animation: countPulse 1s ease-in-out infinite;
        }

        @keyframes countPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .fun-text {
            font-size: 1rem;
            color: #999;
            margin-top: 1rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- 背景粒子 -->
    <div class="particles" id="particles"></div>

    <!-- 年龄验证界面 -->
    <div class="age-gate-container" id="ageGate">
        <div class="age-gate-box">
            <div class="warning-icon">🔞</div>
            <h1 class="age-gate-title">年龄确认</h1>
            <p class="age-gate-subtitle">
                根据相关法律法规，<br>
                本游戏内容可能包含令人兴奋的挑战和刺激的谜题。<br>
                请确认您已年满18周岁。
            </p>
            <div class="age-buttons">
                <button class="age-btn btn-yes" onclick="handleAgeConfirm(true)">
                    <span>我已满18岁</span>
                </button>
                <button class="age-btn btn-no" onclick="handleAgeConfirm(false)">
                    <span>我未满18岁</span>
                </button>
            </div>
            <p class="fun-text">* 诚实是一种美德哦 😊</p>
        </div>
    </div>

    <!-- 成年结果页面 -->
    <div class="result-container result-adult" id="resultAdult">
        <div class="result-box">
            <div class="result-icon">🎉</div>
            <h2 class="result-title">欢迎进入游戏！</h2>
            <p class="result-message">
                恭喜你通过年龄验证！<br>
                作为一个成年人，你已经准备好迎接挑战了。<br>
                接下来的谜题会更加有趣和烧脑！
            </p>
            <div class="result-image" id="adultImage"></div>
            <button class="continue-btn" onclick="continueToNextLevel()">
                开始冒险 →
            </button>
        </div>
    </div>

    <!-- 未成年结果页面 -->
    <div class="result-container result-underage" id="resultUnderage">
        <div class="result-box">
            <div class="result-icon">😅</div>
            <h2 class="result-title">哎呀！</h2>
            <p class="result-message">
                小朋友，你还太年轻了！<br>
                不过别担心，我们会在<br>
                <span class="countdown" id="countdown">5</span><br>
                秒后自动让你进入游戏...<br>
                <br>
                <small style="color: #999;">（毕竟这只是个解谜游戏嘛 😄）</small>
            </p>
            <div class="result-image" id="underageImage"></div>
            <p class="fun-text">
                温馨提示：诚实很重要，但游戏更重要！
            </p>
        </div>
    </div>

    <script>
        // 创建背景粒子
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 2;
                const startX = Math.random() * 100;
                const drift = (Math.random() - 0.5) * 200;
                const duration = Math.random() * 10 + 10;
                const delay = Math.random() * 5;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = startX + '%';
                particle.style.setProperty('--drift', drift + 'px');
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // 处理年龄确认
        let isAdultVersion = false;
        
        function handleAgeConfirm(isAdult) {
            isAdultVersion = isAdult;
            const ageGate = document.getElementById('ageGate');
            
            // 隐藏年龄验证界面
            ageGate.classList.add('hidden');
            
            setTimeout(() => {
                if (isAdult) {
                    showAdultResult();
                } else {
                    showUnderageResult();
                }
            }, 500);
        }

        // 显示成年结果
        function showAdultResult() {
            const resultAdult = document.getElementById('resultAdult');
            const adultImage = document.getElementById('adultImage');
            
            // 这里可以添加一个有趣的图片
            adultImage.innerHTML = '<div style="font-size: 80px; padding: 2rem;">🎮🎯🧩</div>';
            
            resultAdult.classList.add('show');
        }

        // 显示未成年结果
        function showUnderageResult() {
            const resultUnderage = document.getElementById('resultUnderage');
            const underageImage = document.getElementById('underageImage');
            const countdownEl = document.getElementById('countdown');
            
            // 这里可以添加一个有趣的图片
            underageImage.innerHTML = '<div style="font-size: 80px; padding: 2rem;">👶📚🍼</div>';
            
            resultUnderage.classList.add('show');
            
            // 倒计时
            let count = 5;
            const countInterval = setInterval(() => {
                count--;
                countdownEl.textContent = count;
                
                if (count <= 0) {
                    clearInterval(countInterval);
                    continueToNextLevel();
                }
            }, 1000);
        }

        // 继续到下一关
        function continueToNextLevel() {
            // 添加过渡动画
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                // 跳转到 GalGame 页面，传递是否成人版本参数
                window.location.href = 'GalGame.html?adult=' + isAdultVersion;
            }, 500);
        }

        // 页面加载时创建粒子
        window.addEventListener('load', () => {
            createParticles();
        });

        // 防止通过浏览器后退绕过验证
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
