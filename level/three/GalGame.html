<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalGame - 恋爱冒险游戏</title>
    <link rel="stylesheet" href="/css/galgame.css">
</head>
<body>
    <div id="loadingScreen">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <h2>游戏加载中...</h2>
            <p>准备开始你的冒险</p>
        </div>
    </div>

    <div id="gameContainer">
        <div class="game-ui-top">
            <div class="game-title">恋爱冒险游戏</div>
            <div class="version-badge" id="versionBadge">普通版</div>
            <div class="ui-buttons">
                <button class="skip-btn" onclick="skipToEnding()" title="快速跳转到结局">跳过</button>
                <button class="menu-btn" onclick="returnToMenu()" title="返回主菜单">菜单</button>
            </div>
        </div>

        <div class="game-background" id="gameBackground"></div>
        <div class="background-overlay"></div>

        <div class="character-container" id="characterContainer"></div>

        <div class="choices-center-container" id="choicesCenterContainer">
            <div class="choices-container" id="choicesContainer"></div>
        </div>

        <div class="dialog-container">
            <div class="dialog-background"></div>
            <div class="dialog-content">
                <div class="character-name" id="characterName">角色</div>
                <div class="dialog-text-wrapper">
                    <div class="dialog-text" id="dialogText">游戏加载中...</div>
                </div>
            </div>
            <button class="next-btn" id="nextBtn" onclick="nextDialog()" style="display: none;">继续 →</button>
        </div>

        <div class="ending-screen" id="endingScreen">
            <div class="ending-content">
                <h2 id="endingTitle">游戏结束</h2>
                <p id="endingText">感谢你的游玩！</p>
                <div class="ending-image" id="endingImage">[结局图片 - 预留]</div>
                <button class="restart-btn" id="restartBtn" onclick="restartGame()">重新开始</button>
            </div>
        </div>
    </div>

    <script>
        let currentGame = {
            version: 'normal',
            currentSceneIndex: 0,
            currentChoices: [],
            playerChoices: [],
            scriptData: null
        };

        const gameScripts = {};

        async function loadGameScripts() {
            try {
                const normalResponse = await fetch('./data/galgame_normal.json');
                const normalData = await normalResponse.json();
                gameScripts.normal = normalData.scenes;

                const adultResponse = await fetch('./data/galgame_adult.json');
                const adultData = await adultResponse.json();
                gameScripts.adult = adultData.scenes;

                initGame();
            } catch (error) {
                console.error('加载游戏脚本失败:', error);
                alert('游戏加载失败，请检查JSON文件是否存在！');
            }
        }

        function getUrlParam(paramName) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(paramName);
        }

        function initGame() {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';

                const adultParam = getUrlParam('adult');
                const version = adultParam === 'true' ? 'adult' : 'normal';
                
                startGame(version);
            }, 1000);
        }

        function startGame(version) {
            currentGame.version = version;
            currentGame.currentSceneIndex = 0;
            currentGame.playerChoices = [];

            const badge = document.getElementById('versionBadge');
            if (version === 'adult') {
                badge.textContent = '18+ 成人版';
                badge.classList.add('adult');
            } else {
                badge.textContent = '普通版';
                badge.classList.remove('adult');
            }

            const background = document.getElementById('gameBackground');
            background.classList.remove('normal', 'adult');
            background.classList.add(version);

            showDialog(0);
        }

        function showDialog(sceneIndex) {
            const scripts = gameScripts[currentGame.version];
            
            if (sceneIndex < 0 || sceneIndex >= scripts.length) {
                showEnding();
                return;
            }

            const scene = scripts[sceneIndex];
            currentGame.currentSceneIndex = sceneIndex;
            currentGame.currentChoices = scene.choices;

            const characterName = document.getElementById('characterName');
            characterName.textContent = scene.characterName;
            if (currentGame.version === 'adult') {
                characterName.classList.add('adult');
            } else {
                characterName.classList.remove('adult');
            }
            
            document.getElementById('dialogText').textContent = scene.text;

            const background = document.getElementById('gameBackground');
            background.classList.remove('normal', 'adult');
            background.classList.add(scene.background);

            updateCharacterSprite(scene.sprite);

            showChoices(scene.choices);
        }

        function showChoices(choices) {
            const choicesContainer = document.getElementById('choicesContainer');
            choicesContainer.innerHTML = '';

            if (choices.length === 0) {
                choicesContainer.style.display = 'none';
                document.getElementById('nextBtn').style.display = 'block';
                return;
            }

            choicesContainer.style.display = 'flex';

            choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice.text;
                
                if (choice.text.includes('***')) {
                    button.classList.add('adult-only');
                }
                
                button.onclick = () => {
                    currentGame.playerChoices.push(choice.text);
                    showDialog(choice.nextIndex);
                };
                choicesContainer.appendChild(button);
            });

            document.getElementById('nextBtn').style.display = 'none';
        }

        function nextDialog() {
            const nextIndex = currentGame.currentSceneIndex + 1;
            showDialog(nextIndex);
        }

        function updateCharacterSprite(spriteUrl) {
            const container = document.getElementById('characterContainer');
            container.innerHTML = '';
            
            if (spriteUrl) {
                const sprite = document.createElement('div');
                sprite.className = 'character-sprite';
                sprite.style.backgroundImage = `url('${spriteUrl}')`;
                container.appendChild(sprite);
            }
        }

        function showEnding() {
            const endingScreen = document.getElementById('endingScreen');
            const endingContent = endingScreen.querySelector('.ending-content');
            const endingTitle = document.getElementById('endingTitle');
            const endingText = document.getElementById('endingText');
            const endingImage = document.getElementById('endingImage');
            const restartBtn = document.getElementById('restartBtn');

            if (currentGame.version === 'normal') {
                endingContent.classList.remove('adult');
                endingTitle.textContent = '美好的结局';
                endingText.textContent = '你和小雨开始了一段美好的恋爱。在彼此的陪伴下，生活变得更加充满色彩。这是一个温暖而幸福的故事结局...';
                restartBtn.classList.remove('adult');
                endingImage.classList.remove('adult');
            } else {
                endingContent.classList.add('adult');
                endingTitle.textContent = '激情的承诺';
                endingText.textContent = '你和李思之间的关系变得更加深刻和亲密。在这个充满激情的夜晚之后，你们决定共同面对未来。这是一个充满爱和欲望的故事结局...';
                restartBtn.classList.add('adult');
                endingImage.classList.add('adult');
            }

            endingScreen.classList.add('show');
        }

        function restartGame() {
            document.getElementById('endingScreen').classList.remove('show');
            location.reload();
        }

        function returnToMenu() {
            if (confirm('确定要返回菜单吗？进度将丢失。')) {
                window.history.back();
            }
        }

        function skipToEnding() {
            if (confirm('确定要跳过到结局吗？')) {
                showEnding();
            }
        }

        window.addEventListener('load', loadGameScripts);
    </script>
</body>
</html>
