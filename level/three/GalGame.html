<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周年庆典限定互动 - 阿珏酱Blog十周年庆解密游戏</title>
    <meta name="description" content="阿珏酱Blog十周年庆解密游戏，参与解密游戏，赢取神秘大奖！">
    <meta name="keywords" content="阿珏酱Blog十周年庆解密游戏, 解密游戏, 神秘大奖">
    <link rel="stylesheet" href="/css/galgame.css">
</head>
<body class="showing-start-screen">
    <div id="loadingScreen">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <h2>游戏加载中...</h2>
            <p>准备开始你的恋爱冒险</p>
        </div>
    </div>

    <div id="gameContainer">
        <div id="startScreen" class="start-screen hidden" aria-hidden="true">
            <div class="start-screen-overlay"></div>
            <div class="start-screen-layout">
                <div class="start-screen-thumbs" id="startScreenThumbs" role="group" aria-label=""></div>
            </div>
        </div>
        <div class="game-ui-top">
            <div class="game-title">解谜企划☆绝密</div>
            <div class="version-badge" id="versionBadge"></div>
            <div class="ui-buttons">
                <button class="fullscreen-btn" onclick="toggleFullscreen()" title="切换全屏">全屏</button>
                <button class="skip-btn" onclick="skipToEnding()" title="快速跳转到结局">跳过</button>
                <button class="menu-btn" onclick="returnToMenu()" title="返回主菜单">菜单</button>
            </div>
        </div>

        <div class="game-background" id="gameBackground"></div>
        <div class="background-overlay"></div>

        <div class="character-container" id="characterContainer"></div>

        <div class="choices-center-container" id="choicesCenterContainer">
            <div class="choices-container" id="choicesContainer"></div>
        </div>

        <div class="dialog-container">
            <div class="dialog-background"></div>
            <div class="dialog-content">
                <div class="character-name" id="characterName">角色</div>
                <div class="dialog-text-wrapper">
                    <div class="dialog-text" id="dialogText">游戏加载中...</div>
                </div>
            </div>
            <button class="next-btn" id="nextBtn" onclick="nextDialog()" style="display: none;">继续 →</button>
        </div>

        <div class="ending-screen" id="endingScreen">
            <div class="ending-content">
                <h2>完结撒花</h2>
                <p>感谢你的陪伴！</p>
                <div class="ending-image">
                    <img id="endingImage" src="" alt="结局图片">
                </div>
                <button class="restart-btn" onclick="restartGame()">再来一次</button>
                <button class="restart-btn" onclick="nextlevel()">去下一关</button>
            </div>
    </div>
    </div>

    <div id="miniGamePrompt" class="mini-game-prompt hidden" role="status" aria-live="polite">
        <div class="mini-game-box" role="dialog" aria-modal="true">
            <h3>支线小游戏</h3>
            <p id="miniGameStatus">已经在后台开启了猜数字挑战，请完成后再回来。</p>
            <p class="mini-game-tip">完成小游戏才能继续当前剧情。</p>
            <div class="mini-game-actions">
                <button id="miniGameReopen" type="button">重新打开小游戏窗口</button>
            </div>
        </div>
    </div>

    <script>
        let currentGame = {
            version: 'normal',
            currentSceneIndex: 0,
            currentChoices: [],
            playerChoices: [],
            scriptData: null,
            hasStarted: false
        };

        const gameScripts = {};
        const MINI_GAME_STORAGE_KEY = 'branchGameResult';
        const MINI_GAME_URL = '../3branch/index.html';
        const miniGamePromptEl = document.getElementById('miniGamePrompt');
        const miniGameStatusEl = document.getElementById('miniGameStatus');
        const miniGameReopenBtn = document.getElementById('miniGameReopen');
        const endingImageEl = document.getElementById('endingImage');
        const ENDING_IMAGES = [
            '/images/99CEE870F1A04CE8DBBA902BA255864E.png',
            '/images/bf.jpg'
        ];
        const miniGameState = {
            active: false,
            windowRef: null,
            monitorId: null,
            listening: false
        };
        const START_SCREEN_CONFIG = {
            normal: {
                background: '/images/galgame/千恋万花/bg.jpg',
                thumbs: [
                    '/images/galgame/千恋万花/1.png',
                    '/images/galgame/千恋万花/2.png',
                    '/images/galgame/千恋万花/3.png',
                    '/images/galgame/千恋万花/4.png',
                    '/images/galgame/千恋万花/5.png'
                ],
                startIndex: 0,
                exitIndex: 4,
                characters: [
                    {
                        id: 'xiaqing',
                        name: '夏晴',
                        url: '/images/galgame/千恋万花/girl/0c.png',
                        position: 'left'
                    },
                    {
                        id: 'linglei',
                        name: '澪澪',
                        url: '/images/galgame/千恋万花/girl/bf.png',
                        position: 'right'
                    }
                ]
            },
            adult: {
                background: '/images/galgame/沙滩排球/bg.jpg',
                thumbs: [
                    '/images/galgame/沙滩排球/1.png',
                    '/images/galgame/沙滩排球/2.png',
                    '/images/galgame/沙滩排球/3.png',
                    '/images/galgame/沙滩排球/4.png',
                    '/images/galgame/沙滩排球/5.png',
                ],
                startIndex: 1,
                exitIndex: 4,
                characters: [
                    {
                        id: 'xiaqing',
                        name: '夏晴',
                        url: '/images/galgame/沙滩排球/girl/0c.png',
                        position: 'left'
                    },
                    {
                        id: 'linglei',
                        name: '澪澪',
                        url: '/images/galgame/沙滩排球/girl/bf.png',
                        position: 'right'
                    }
                ]
            }
        };
        const startScreenEl = document.getElementById('startScreen');
        const startScreenThumbs = document.getElementById('startScreenThumbs');
        const characterPresetCache = {};

        if (miniGameReopenBtn) {
            miniGameReopenBtn.addEventListener('click', () => {
                attemptOpenMiniGame(true);
            });
        }

        function getConfiguredCharacters(version) {
            const key = version || 'normal';
            if (!characterPresetCache[key]) {
                const config = START_SCREEN_CONFIG[key] || START_SCREEN_CONFIG.normal || {};
                const characters = config.characters || [];
                characterPresetCache[key] = characters.map((character, index) => ({
                    id: character.id || `character_${key}_${index}`,
                    key: character.key || character.id || `character_${key}_${index}`,
                    name: character.name || '',
                    url: character.url,
                    position: character.position || (index === 0 ? 'left' : 'right')
                }));
            }
            return characterPresetCache[key];
        }

        function buildSceneSprites(scene = null, version = '') {
            if (scene && scene.sprites) {
                return scene.sprites;
            }
            const targetVersion = version || currentGame.version || 'normal';
            const presets = getConfiguredCharacters(targetVersion);
            if (!presets.length) {
                return null;
            }

            const activeSet = Array.isArray(scene && scene.activeCharacters)
                ? new Set(scene.activeCharacters)
                : null;

            return presets.map((character, index) => ({
                key: character.key || character.id || `character_${targetVersion}_${index}`,
                id: character.id,
                url: character.url,
                position: character.position || (index === 0 ? 'left' : 'right'),
                active: activeSet ? activeSet.has(character.id) : undefined
            }));
        }


        async function loadGameScripts() {
            try {
                const normalResponse = await fetch('./data/galgame_normal.json');
                const normalData = await normalResponse.json();
                gameScripts.normal = normalData.scenes;

                const adultResponse = await fetch('./data/galgame_adult.json');
                const adultData = await adultResponse.json();
                gameScripts.adult = adultData.scenes;

                initGame();
            } catch (error) {
                console.error('加载游戏脚本失败:', error);
                alert('游戏加载失败，请检查JSON文件是否存在！');
            }
        }

        function getUrlParam(paramName) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(paramName);
        }

        function initGame() {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';

                const adultParam = getUrlParam('adult');
                const version = adultParam === 'true' ? 'adult' : 'normal';
                
                startGame(version);
            }, 1000);
        }

        function startGame(version) {
            currentGame.version = version;
            currentGame.currentSceneIndex = 0;
            currentGame.playerChoices = [];
            currentGame.hasStarted = false;

            const badge = document.getElementById('versionBadge');
            if (version === 'adult') {
                badge.textContent = '夏夜海边的秘密嬉戏';
                badge.classList.add('adult');
            } else {
                badge.textContent = '放学后的教室小秘密';
                badge.classList.remove('adult');
            }

            const background = document.getElementById('gameBackground');
            background.classList.remove('normal', 'adult');
            background.classList.add(version);

            renderStartScreen(version);
        }

        function renderStartScreen(version) {
            if (!startScreenEl) {
                beginStory();
                return;
            }

            const config = START_SCREEN_CONFIG[version] || START_SCREEN_CONFIG.normal;
            startScreenEl.style.backgroundImage = `url('${config.background}')`;
            if (document.body) {
                document.body.classList.add('showing-start-screen');
            }

            buildStartScreenButtons(config);
            startScreenEl.classList.remove('hidden');
            startScreenEl.setAttribute('aria-hidden', 'false');
            startScreenEl.removeAttribute('inert');
        }

        function buildStartScreenButtons(config) {
            if (!startScreenThumbs) {
                beginStory();
                return;
            }

            startScreenThumbs.innerHTML = '';
            config.thumbs.forEach((imageUrl, index) => {
                const slot = document.createElement('div');
                slot.className = 'start-thumb-slot';
                slot.dataset.index = index;

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'start-thumb-btn';
                button.style.setProperty('--enter-delay', `${Math.min(index * 0.08, 0.4)}s`);
                const image = document.createElement('img');
                image.src = imageUrl;
                image.className = 'start-thumb-image';
                button.appendChild(image);

                if (index === config.startIndex) {
                    button.dataset.role = 'start';
                    button.addEventListener('click', () => beginStory());
                } else if (index === config.exitIndex) {
                    button.dataset.role = 'exit';
                    button.addEventListener('click', exitGameFromStartScreen);
                } else {
                    button.dataset.role = 'tease';
                    attachTeaseBehavior(button);
                }

                slot.appendChild(button);
                startScreenThumbs.appendChild(slot);
            });
        }

        function attachTeaseBehavior(button) {
            const getViewportWidth = () => window.innerWidth || document.documentElement.clientWidth || 1024;
            const getViewportHeight = () => window.innerHeight || document.documentElement.clientHeight || 768;
            const margin = 24;

            const ensureFloating = () => {
                if (button.dataset.floating === 'true') {
                    return;
                }
                const rect = button.getBoundingClientRect();
                button.classList.add('tease-floating');
                button.style.left = `${rect.left}px`;
                button.style.top = `${rect.top}px`;
                button.style.width = `${rect.width}px`;
                button.style.height = `${rect.height}px`;
                button.dataset.floating = 'true';
                const slot = button.closest('.start-thumb-slot');
                if (slot) {
                    const preservedHeight = slot.offsetHeight || rect.height || 140;
                    slot.style.setProperty('--slot-height', `${preservedHeight}px`);
                }
            };

            const moveToRandomPosition = () => {
                ensureFloating();
                const btnWidth = button.offsetWidth || 140;
                const btnHeight = button.offsetHeight || 140;
                const horizontalRange = Math.max(getViewportWidth() - btnWidth - (margin * 2), 0);
                const verticalRange = Math.max(getViewportHeight() - btnHeight - (margin * 2), 0);
                const targetX = margin + Math.random() * horizontalRange;
                const targetY = margin + Math.random() * verticalRange;
                const rotate = (Math.random() * 16) - 8;

                button.style.left = `${targetX}px`;
                button.style.top = `${targetY}px`;
                button.style.transform = `rotate(${rotate}deg)`;
            };

            const dodge = (event) => {
                if (event && typeof event.preventDefault === 'function') {
                    event.preventDefault();
                }
                if (event && typeof event.stopPropagation === 'function') {
                    event.stopPropagation();
                }
                moveToRandomPosition();
            };

            button.tabIndex = -1;
            button.addEventListener('mouseenter', dodge);
            button.addEventListener('focus', dodge);
            button.addEventListener('click', dodge);
            try {
                button.addEventListener('touchstart', dodge, { passive: false });
            } catch (error) {
                button.addEventListener('touchstart', dodge);
            }
        }

        function hideStartScreen() {
            if (startScreenEl) {
                if (startScreenEl.contains(document.activeElement)) {
                    document.activeElement.blur();
                    const fallbackFocus = document.getElementById('nextBtn');
                    if (fallbackFocus) {
                        fallbackFocus.focus();
                    }
                }
                startScreenEl.classList.add('hidden');
                startScreenEl.setAttribute('aria-hidden', 'true');
                startScreenEl.setAttribute('inert', '');
            }
        }

        function exitGameFromStartScreen() {
            hideStartScreen();
            if (document.body) {
                document.body.classList.remove('showing-start-screen');
            }
            window.location.href = 'about:blank';
        }

        function beginStory() {
            if (currentGame.hasStarted) {
                return;
            }
            currentGame.hasStarted = true;
            hideStartScreen();
            if (document.body) {
                document.body.classList.remove('showing-start-screen');
            }
            showDialog(0);
        }

        function showDialog(sceneIndex) {
            const scripts = gameScripts[currentGame.version];
            
            if (sceneIndex < 0 || sceneIndex >= scripts.length) {
                showEnding();
                return;
            }

            const scene = scripts[sceneIndex];
            currentGame.currentSceneIndex = sceneIndex;
            currentGame.currentChoices = scene.choices;

            const characterName = document.getElementById('characterName');
            characterName.textContent = scene.characterName;
            if (currentGame.version === 'adult') {
                characterName.classList.add('adult');
            } else {
                characterName.classList.remove('adult');
            }
            
            document.getElementById('dialogText').textContent = scene.text;

            const background = document.getElementById('gameBackground');
            background.classList.remove('normal', 'adult');
            background.classList.add(currentGame.version);

            const spritePayload = buildSceneSprites(scene, currentGame.version);
            updateCharacterSprite(spritePayload, scene.characterName || '');

            showChoices(scene.choices);
            maybeTriggerMiniGame(scene.text);
        }

        function showChoices(choices) {
            const choicesContainer = document.getElementById('choicesContainer');
            choicesContainer.innerHTML = '';

            if (choices.length === 0) {
                choicesContainer.style.display = 'none';
                document.getElementById('nextBtn').style.display = 'block';
                return;
            }

            choicesContainer.style.display = 'flex';

            choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice.text;
                
                if (choice.text.includes('***')) {
                    button.classList.add('adult-only');
                }
                
                button.onclick = () => {
                    currentGame.playerChoices.push(choice.text);
                    showDialog(choice.nextIndex);
                };
                choicesContainer.appendChild(button);
            });

            document.getElementById('nextBtn').style.display = 'none';
        }

        function nextDialog() {
            const nextIndex = currentGame.currentSceneIndex + 1;
            showDialog(nextIndex);
        }

        function updateCharacterSprite(spriteConfig, speakerName = '') {
            const container = document.getElementById('characterContainer');
            if (!container) {
                return;
            }

            if (!spriteConfig) {
                container.innerHTML = '';
                return;
            }

            const sprites = Array.isArray(spriteConfig) ? spriteConfig : [spriteConfig];
            if (sprites.length === 0) {
                container.innerHTML = '';
                return;
            }

            const narratorMode = typeof speakerName === 'string' && speakerName.includes('旁白');

            const existingSprites = new Map(
                Array.from(container.children).map((el) => [el.dataset.key, el])
            );
            const seenKeys = new Set();
            const triggerBounce = (element) => {
                if (typeof element.animate === 'function') {
                    element.animate(
                        [
                            { transform: 'translateY(0)' },
                            { transform: 'translateY(-16px)' },
                            { transform: 'translateY(4px)' },
                            { transform: 'translateY(0)' }
                        ],
                        {
                            duration: 340,
                            easing: 'cubic-bezier(0.33, 0, 0.3, 1)',
                            fill: 'none'
                        }
                    );
                } else {
                    element.classList.remove('talk-bounce');
                    void element.offsetWidth;
                    element.classList.add('talk-bounce');
                }
            };

            sprites.forEach((entry, index) => {
                const config = typeof entry === 'string' ? { url: entry } : entry;
                if (!config || !config.url) {
                    return;
                }

                const position = config.position
                    || (sprites.length === 1 ? 'center' : (index === 0 ? 'left' : 'right'));
                const spriteKey = config.key || config.id || `${config.url}_${position}`;
                seenKeys.add(spriteKey);
                let sprite = existingSprites.get(spriteKey);
                const isNewSprite = !sprite;
                if (!sprite) {
                    sprite = document.createElement('div');
                    sprite.dataset.key = spriteKey;
                }

                sprite.className = 'character-sprite';
                sprite.classList.add(`pos-${position}`);
                const isActive = !narratorMode && config.active !== false;
                if (isActive) {
                    sprite.classList.remove('inactive');
                    sprite.classList.add('active');
                    if (!isNewSprite) {
                        triggerBounce(sprite);
                    }
                } else {
                    sprite.classList.remove('active');
                    sprite.classList.add('inactive');
                    sprite.classList.remove('talk-bounce');
                }

                sprite.style.backgroundImage = `url('${config.url}')`;
                sprite.dataset.key = spriteKey;
                if (isNewSprite) {
                    sprite.classList.add('sprite-enter');
                    const handleEnterEnd = (event) => {
                        if (event.animationName === 'fadeIn') {
                            sprite.classList.remove('sprite-enter');
                            sprite.removeEventListener('animationend', handleEnterEnd);
                        }
                    };
                    sprite.addEventListener('animationend', handleEnterEnd);
                }
                container.appendChild(sprite);
            });

            Array.from(container.children).forEach((child) => {
                if (!seenKeys.has(child.dataset.key)) {
                    child.remove();
                }
            });
        }

        function setRandomEndingImage() {
            if (!endingImageEl || !ENDING_IMAGES.length) {
                return;
            }
            const randomIndex = Math.floor(Math.random() * ENDING_IMAGES.length);
            endingImageEl.src = ENDING_IMAGES[randomIndex];
        }

        function showEnding() {
            const endingScreen = document.getElementById('endingScreen');
            setRandomEndingImage();
            endingScreen.classList.add('show');
        }

        function restartGame() {
            document.getElementById('endingScreen').classList.remove('show');
            location.reload();
        }

        function nextlevel() {
            document.getElementById('endingScreen').classList.remove('show');
            window.location.href = '/level/four/GalGame.html';
        }

        function returnToMenu() {
            if (confirm('确定要返回菜单吗？进度将丢失。')) {
                window.history.back();
            }
        }

        function skipToEnding() {
            if (confirm('确定要跳过到结局吗？')) {
                showEnding();
            }
        }

        function maybeTriggerMiniGame(text = '') {
            if (!text.includes('小游戏窗口弹出')) {
                return;
            }
            if (miniGameState.active) {
                return;
            }
            startMiniGameChallenge();
        }

        function startMiniGameChallenge() {
            miniGameState.active = true;
            showMiniGamePrompt();
            updateMiniGamePrompt('支线小游戏窗口已打开，请专心完成猜数字挑战。');
            attemptOpenMiniGame();
            startMiniGameWatchers();
        }

        function updateMiniGamePrompt(message) {
            if (miniGameStatusEl) {
                miniGameStatusEl.textContent = message;
            }
        }

        function showMiniGamePrompt() {
            if (miniGamePromptEl) {
                miniGamePromptEl.classList.remove('hidden');
            }
        }

        function hideMiniGamePrompt() {
            if (miniGamePromptEl) {
                miniGamePromptEl.classList.add('hidden');
            }
        }

        function attemptOpenMiniGame(userTriggered = false) {
            try {
                const popupWidth = 760;
                const popupHeight = 620;
                const screenLeft = window.screenLeft ?? window.screenX ?? 0;
                const screenTop = window.screenTop ?? window.screenY ?? 0;
                const viewportWidth = window.outerWidth || window.innerWidth || window.screen.width;
                const viewportHeight = window.outerHeight || window.innerHeight || window.screen.height;
                const left = Math.max(screenLeft + (viewportWidth - popupWidth) / 2, 0);
                const top = Math.max(screenTop + (viewportHeight - popupHeight) / 2, 0);

                const features = [
                    'noopener',
                    'noreferrer',
                    'resizable=yes',
                    'scrollbars=yes',
                    `width=${popupWidth}`,
                    `height=${popupHeight}`,
                    `left=${Math.round(left)}`,
                    `top=${Math.round(top)}`
                ].join(',');

                miniGameState.windowRef = window.open(MINI_GAME_URL, 'branchGamePopup', features);
                if (miniGameState.windowRef) {
                    miniGameState.windowRef.focus();
                    updateMiniGamePrompt('支线小游戏窗口已居中弹出，请完成猜数字挑战。');
                } else if (!userTriggered) {
                    updateMiniGamePrompt('浏览器阻止了自动打开，请点击按钮手动启动小游戏。');
                }
            } catch (error) {
                console.warn('无法打开支线小游戏窗口:', error);
                updateMiniGamePrompt('自动打开失败，请点击按钮重试。');
                miniGameState.windowRef = null;
            }
        }

        function startMiniGameWatchers() {
            if (!miniGameState.listening) {
                window.addEventListener('storage', handleMiniGameStorage);
                miniGameState.listening = true;
            }
            if (miniGameState.monitorId) {
                clearInterval(miniGameState.monitorId);
            }
            miniGameState.monitorId = window.setInterval(checkMiniGameCompletion, 1500);
        }

        function stopMiniGameWatchers() {
            if (miniGameState.listening) {
                window.removeEventListener('storage', handleMiniGameStorage);
                miniGameState.listening = false;
            }
            if (miniGameState.monitorId) {
                clearInterval(miniGameState.monitorId);
                miniGameState.monitorId = null;
            }
        }

        function handleMiniGameStorage(event) {
            if (event.key === MINI_GAME_STORAGE_KEY && event.newValue) {
                checkMiniGameCompletion();
            }
        }

        function checkMiniGameCompletion() {
            const result = readMiniGameResult();
            if (result && result.completed) {
                finalizeMiniGame();
                return true;
            }
            return false;
        }

        function readMiniGameResult() {
            try {
                const raw = localStorage.getItem(MINI_GAME_STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                console.warn('解析支线小游戏结果失败:', error);
                return null;
            }
        }

        function finalizeMiniGame() {
            miniGameState.active = false;
            closeMiniGameWindow();
            stopMiniGameWatchers();
            setTimeout(() => {
                hideMiniGamePrompt();
            }, 1800);
        }

        function closeMiniGameWindow() {
            if (miniGameState.windowRef && !miniGameState.windowRef.closed) {
                miniGameState.windowRef.close();
            }
            miniGameState.windowRef = null;
        }

        window.addEventListener('beforeunload', () => {
            closeMiniGameWindow();
            stopMiniGameWatchers();
        });

        window.addEventListener('load', loadGameScripts);

        toggleFullscreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    alert(`无法进入全屏模式: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        };
    </script>
</body>
</html>
